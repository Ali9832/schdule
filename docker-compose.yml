services:
  postgres:
    image: postgres:16-alpine
    container_name: nova-planner-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: nova_planner
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - nova_planner_data:/var/lib/postgresql/data

volumes:
  nova_planner_data:
